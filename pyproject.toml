[project]
name = "jobhunt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.4"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
jobhunt = "jobhunt:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
